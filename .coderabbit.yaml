# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# TODO: delete this file after PR #1601 (Elasticsearch-only database) is merged.
reviews:
  # Files removed with SQLite and Typesense. They no longer exist, so they need no review.
  path_filters:
    - '!schemas/**'
    - '!scripts/inspect-job-metrics.mjs'
    - '!typesense-compose.yml'
    - '!src/@types/Typesense.ts'
    - '!src/components/database/SQLLite*.ts'
    - '!src/components/database/sqlite*.ts'
    - '!src/components/database/Typesense*.ts'
    - '!src/components/database/typesense*.ts'
    - '!src/test/data/ddoSchema.ts'
    - '!src/test/data/nonceSchema.ts'
    - '!src/test/integration/nonce.test.ts'
    - '!src/test/integration/typesense.test.ts'
    - '!src/test/unit/sqliteClient.test.ts'
    # More than 100 files: CodeRabbit skips the review. Docs, the lock file, agent files and
    # tests that change only to fit the new database (new test files are still reviewed).
    - '!docs/**'
    - '!package-lock.json'
    - '!AGENTS.md'
    - '!CLAUDE.md'
    - '!README.md'
    - '!.github/copilot-instructions.md'
    - '!src/test/.env.test'
    - '!src/test/config.json'
    - '!src/test/integration/compute.test.ts'
    - '!src/test/integration/configDatabase.test.ts'
    - '!src/test/integration/database.test.ts'
    - '!src/test/integration/elasticsearch.test.ts'
    - '!src/test/integration/imageCleanup.test.ts'
    - '!src/test/integration/indexer.test.ts'
    - '!src/test/integration/logs.test.ts'
    - '!src/test/integration/maintenanceMode.test.ts'
    - '!src/test/integration/persistentStorage.test.ts'
    - '!src/test/unit/auth/token.test.ts'
    - '!src/test/unit/compute.test.ts'
    - '!src/test/unit/config.test.ts'
    - '!src/test/unit/database/getJobsFilters.test.ts'
    - '!src/test/unit/escrowFilters.test.ts'
    - '!src/test/unit/fileInfoHandler.test.ts'
    - '!src/test/unit/indexer/validation.test.ts'
    - '!src/test/unit/maintenanceCoverage.test.ts'
    - '!src/test/unit/maintenanceMode.test.ts'
    - '!src/test/unit/nodeMetricsHandlers.test.ts'
    - '!src/test/unit/oceanP2P.test.ts'
    - '!src/test/unit/p2p/provideLimiter.test.ts'
    - '!src/test/unit/p2p/republishStoredDdos.test.ts'
    - '!src/test/unit/persistentStorageSharing.test.ts'
    - '!src/test/unit/safeUrl.test.ts'
    - '!src/test/unit/service/serviceDiskUsage.test.ts'
    - '!src/test/unit/service/serviceJobsDatabase.test.ts'
    - '!src/test/unit/service/serviceRestartRace.test.ts'
    - '!src/test/utils/hooks.ts'
    - '!src/test/utils/utils.ts'
